journal = "mdpi_energies"
manuscript = "manuscript/journal_submission/paper.tex"

[checks]
abstract_word_limit = 220
placeholder_globs = ["manuscript/MANUSCRIPT.md"]
required_tracked_files = [
  "manuscript/MANUSCRIPT.md",
  "../../papers/mintou/mintou_p3_samode_distribution_planning/src/configs/real_simbench_planning_config.json",
  "../../scripts/mintou/build_official_journal_previews.py",
  "../../scripts/mintou/harness_acceptance.py",
  "../../scripts/mintou/harness_scientific_acceptance.py",
  "../../scripts/mintou/harness_reconstruction_v2_acceptance.py",
  "../../tests/test_mintou_reconstruction_v2_acceptance.py",
  "experiments/p3_s4_energies_samode_ac_planning_v1/EXPERIMENT_PROTOCOL.md",
  "checkpoints/2026-09-03_mdpi_wave0/CLAIM_EVIDENCE_REGISTER.md",
  "../../tests/test_mintou_experiments.py",
  "../../src/powergrid_benchmark/mintou_experiments.py",
]
allowed_write_paths = [
  "../../papers/mintou/mintou_p3_samode_distribution_planning",
  "../../src/powergrid_benchmark/mintou_real_planning.py",
  "../../src/powergrid_benchmark/mintou_pandapower_validation.py",
  "../../src/powergrid_benchmark/mintou_planning_sensitivity.py",
  "../../src/powergrid_benchmark/mintou_p3_samode_ac.py",
]
read_only_paths = ["../../papers/mintou"]

[transport]
command = "codex exec"
