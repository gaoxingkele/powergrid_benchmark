<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">C2GES experiment and evidence protocol</title>
  <desc id="desc">Development selection, frozen v0.3.1 gate, one formal test attempt, independent audit, and bounded reporting.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#334155"/></marker><style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.done{fill:#ecfdf5}.pending{fill:#fff7ed;stroke:#c2410c}.hist{fill:#fef2f2;stroke:#b91c1c}.h{font:700 30px Arial;fill:#0f172a}.t{font:23px Arial;fill:#0f172a}.s{font:18px Arial;fill:#334155}.l{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}.d{stroke-dasharray:9 7}</style></defs>
  <rect width="1400" height="760" fill="white"/><text x="700" y="50" text-anchor="middle" class="h">Frozen post-audit corrective evaluation protocol</text>
  <rect x="35" y="105" width="235" height="155" class="b done"/><text x="152" y="145" text-anchor="middle" class="t">Stage 1 accepted</text><text x="152" y="183" text-anchor="middle" class="s">full-PDF build08</text><text x="152" y="215" text-anchor="middle" class="s">12 dev / 15 test</text><text x="152" y="244" text-anchor="middle" class="s">test unread</text>
  <rect x="315" y="105" width="235" height="155" class="b done"/><text x="432" y="145" text-anchor="middle" class="t">Development</text><text x="432" y="183" text-anchor="middle" class="s">144 configurations</text><text x="432" y="215" text-anchor="middle" class="s">selected index 60</text><text x="432" y="244" text-anchor="middle" class="s">negative CF ablation</text>
  <rect x="595" y="90" width="250" height="185" class="b done"/><text x="720" y="130" text-anchor="middle" class="t">v0.3.1 freeze</text><text x="720" y="168" text-anchor="middle" class="s">7 conditions · K=5,10</text><text x="720" y="200" text-anchor="middle" class="s">6 primary ROUGE-L tests</text><text x="720" y="232" text-anchor="middle" class="s">pre-test audit PASS</text><text x="720" y="260" text-anchor="middle" class="s">hash authorization recorded</text>
  <rect x="890" y="105" width="225" height="155" class="b done"/><text x="1002" y="145" text-anchor="middle" class="t">One test attempt</text><text x="1002" y="183" text-anchor="middle" class="s">atomic registry claim</text><text x="1002" y="215" text-anchor="middle" class="s">run COMPLETE</text><text x="1002" y="244" text-anchor="middle" class="s">no retry</text>
  <rect x="1160" y="105" width="205" height="155" class="b pending"/><text x="1262" y="145" text-anchor="middle" class="t">Result audit</text><text x="1262" y="183" text-anchor="middle" class="s">hash + ledger checks</text><text x="1262" y="215" text-anchor="middle" class="s">paired statistics</text><text x="1262" y="244" text-anchor="middle" class="s">figure lineage</text>
  <path d="M270 182 H315" class="l"/><path d="M550 182 H595" class="l"/><path d="M845 182 H890" class="l"/><path d="M1115 182 H1160" class="l"/>
  <rect x="235" y="380" width="930" height="165" class="b"/><text x="700" y="422" text-anchor="middle" class="t">Registered formal comparisons</text><text x="700" y="460" text-anchor="middle" class="s">Full − strict no-CF · Full − Semantic-MMR · Full − TextRank</text><text x="700" y="495" text-anchor="middle" class="s">at K=5 and K=10 · report-level paired bootstrap (10,000) · Holm across six tests</text><text x="700" y="530" text-anchor="middle" class="s">all conclusions remain descriptive because prior test-population outcomes were inspected</text>
  <path d="M1262 260 V325 H700 V380" class="l d"/>
  <rect x="35" y="610" width="1330" height="90" class="b hist"/><text x="700" y="645" text-anchor="middle" class="t">Excluded corrective history</text><text x="700" y="680" text-anchor="middle" class="s">v0.1/v0.2 invalidated outputs · v0.3 pre-test FAIL freeze · dev run01/02 timeouts · dev run03 orphan/partial</text>
  <text x="35" y="735" class="s">Historical failures are preserved for audit and cannot be resumed, overwritten, or reported as scientific results.</text>
</svg>
