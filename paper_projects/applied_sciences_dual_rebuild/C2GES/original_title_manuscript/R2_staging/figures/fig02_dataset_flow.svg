<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Full-PDF benchmark construction flow</title>
  <desc id="desc">Flow from 40 NERC PDFs to 27 included reports and the development and untouched test partitions.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8z" fill="#334155"/></marker><style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.blue{fill:#e0f2fe}.green{fill:#ecfdf5}.orange{fill:#fff7ed;stroke:#c2410c}.red{fill:#fef2f2;stroke:#b91c1c}.h{font:700 30px Arial;fill:#0f172a}.t{font:24px Arial;fill:#0f172a}.s{font:18px Arial;fill:#334155}.l{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="700" fill="white"/><text x="700" y="50" text-anchor="middle" class="h">Audited full-PDF benchmark construction</text>
  <rect x="40" y="120" width="250" height="150" class="b blue"/><text x="165" y="165" text-anchor="middle" class="t">40 NERC PDFs</text><text x="165" y="205" text-anchor="middle" class="s">3,200 pages</text><text x="165" y="238" text-anchor="middle" class="s">distinct PDF hashes</text>
  <rect x="370" y="95" width="330" height="200" class="b green"/><text x="535" y="137" text-anchor="middle" class="t">Fail-closed extraction</text><text x="535" y="175" text-anchor="middle" class="s">generic summary end boundary</text><text x="535" y="207" text-anchor="middle" class="s">full body; no fixed cap</text><text x="535" y="239" text-anchor="middle" class="s">pollution + leakage gates</text><text x="535" y="271" text-anchor="middle" class="s">rights ledger</text>
  <path d="M290 195 H370" class="l"/>
  <rect x="790" y="90" width="250" height="135" class="b green"/><text x="915" y="135" text-anchor="middle" class="t">27 included</text><text x="915" y="175" text-anchor="middle" class="s">12,924 candidates</text><text x="915" y="205" text-anchor="middle" class="s">51–1,898/report</text>
  <rect x="790" y="265" width="250" height="120" class="b red"/><text x="915" y="310" text-anchor="middle" class="t">13 excluded</text><text x="915" y="350" text-anchor="middle" class="s">before outcome computation</text>
  <path d="M700 170 H790" class="l"/><path d="M700 240 H745 V325 H790" class="l"/>
  <rect x="1110" y="70" width="250" height="135" class="b blue"/><text x="1235" y="115" text-anchor="middle" class="t">12 development</text><text x="1235" y="153" text-anchor="middle" class="s">144-config search</text><text x="1235" y="185" text-anchor="middle" class="s">grid index 60</text>
  <rect x="1110" y="255" width="250" height="135" class="b orange"/><text x="1235" y="300" text-anchor="middle" class="t">15 untouched test</text><text x="1235" y="338" text-anchor="middle" class="s">EVIDENCE_PENDING_TEST</text><text x="1235" y="370" text-anchor="middle" class="s">one authorized attempt</text>
  <path d="M1040 145 H1110" class="l"/><path d="M1040 170 H1070 V322 H1110" class="l"/>
  <rect x="180" y="480" width="1040" height="135" class="b"/><text x="700" y="523" text-anchor="middle" class="t">Independent Stage-1 acceptance checks over all 27 included reports</text><text x="700" y="562" text-anchor="middle" class="s">0 reference/body page overlap · 0 exact normalized matches · 0 common substring ≥50 characters</text><text x="700" y="596" text-anchor="middle" class="s">0 hits across eight registered extraction-pollution patterns; no claim of general semantic cleanliness</text>
  <text x="40" y="665" class="s">Counts are audited preprocessing evidence. This figure contains no formal test outcome.</text>
</svg>
