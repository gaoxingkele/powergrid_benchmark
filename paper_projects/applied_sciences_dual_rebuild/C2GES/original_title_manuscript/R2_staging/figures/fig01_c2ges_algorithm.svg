<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">C2GES v0.3.1 algorithm architecture</title>
  <desc id="desc">Code-native schematic separating the textual proxy graph, weighted-degree graph salience, typed path-deletion perturbation, and constrained selector.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#374151"/></marker>
    <style>
      .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.data{fill:#e0f2fe}.method{fill:#ecfdf5}.warn{fill:#fff7ed;stroke:#c2410c}.gate{fill:#fef2f2;stroke:#b91c1c}.t{font-family:Arial,sans-serif;font-size:24px;fill:#0f172a}.s{font-family:Arial,sans-serif;font-size:18px;fill:#334155}.h{font-family:Arial,sans-serif;font-size:30px;font-weight:700;fill:#0f172a}.a{stroke:#374151;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:10 8}
    </style>
  </defs>
  <rect width="1400" height="760" fill="white"/>
  <text x="700" y="48" text-anchor="middle" class="h">C²GES v0.3.1: implemented scoring and selection path</text>

  <rect x="40" y="95" width="240" height="130" class="box data"/>
  <text x="160" y="135" text-anchor="middle" class="t">Full-PDF body</text>
  <text x="160" y="170" text-anchor="middle" class="s">non-summary candidates</text>
  <text x="160" y="200" text-anchor="middle" class="s">stable sentence/page IDs</text>

  <rect x="350" y="80" width="290" height="160" class="box method"/>
  <text x="495" y="120" text-anchor="middle" class="t">Sentence channels</text>
  <text x="495" y="155" text-anchor="middle" class="s">Q: lexical relevance</text>
  <text x="495" y="185" text-anchor="middle" class="s">R: five-role evidence</text>
  <text x="495" y="215" text-anchor="middle" class="s">P: position prior</text>

  <rect x="710" y="80" width="300" height="160" class="box method"/>
  <text x="860" y="120" text-anchor="middle" class="t">Typed textual proxy graph</text>
  <text x="860" y="155" text-anchor="middle" class="s">stage-monotone role edges</text>
  <text x="860" y="185" text-anchor="middle" class="s">distance + overlap + role</text>
  <text x="860" y="215" text-anchor="middle" class="s">not a physical causal graph</text>

  <rect x="1075" y="68" width="285" height="185" class="box warn"/>
  <text x="1217" y="110" text-anchor="middle" class="t">Two distinct signals</text>
  <text x="1217" y="150" text-anchor="middle" class="s">G: weighted degree</text>
  <text x="1217" y="182" text-anchor="middle" class="s">C: typed 2–4 edge</text>
  <text x="1217" y="210" text-anchor="middle" class="s">path-strength deletion loss</text>
  <text x="1217" y="238" text-anchor="middle" class="s">non-identity tested</text>

  <path d="M280 160 H350" class="a"/><path d="M640 160 H710" class="a"/><path d="M1010 160 H1075" class="a"/>

  <rect x="350" y="330" width="660" height="150" class="box method"/>
  <text x="680" y="372" text-anchor="middle" class="t">Frozen Full score</text>
  <text x="680" y="410" text-anchor="middle" class="t">0.40Q + 0.20R + 0.15G + 0.15C + 0.10P</text>
  <text x="680" y="448" text-anchor="middle" class="s">strict no-CF sets only C coefficient to zero; no renormalization</text>
  <path d="M495 240 V330" class="a"/><path d="M1217 253 V285 H900 V330" class="a"/>

  <rect x="350" y="555" width="660" height="120" class="box method"/>
  <text x="680" y="598" text-anchor="middle" class="t">Greedy constrained selection</text>
  <text x="680" y="635" text-anchor="middle" class="s">score − 0.50 × maximum selected-sentence Jaccard; K = 5 or 10</text>
  <path d="M680 480 V555" class="a"/>

  <rect x="1075" y="540" width="285" height="150" class="box gate"/>
  <text x="1217" y="580" text-anchor="middle" class="t">Deployment boundary</text>
  <text x="1217" y="615" text-anchor="middle" class="s">source-linked extract</text>
  <text x="1217" y="647" text-anchor="middle" class="s">quality gate + abstention</text>
  <text x="1217" y="676" text-anchor="middle" class="s">qualified human review</text>
  <path d="M1010 615 H1075" class="a dash"/>

  <text x="40" y="728" class="s">Solid arrows: implemented computational dependencies. Dashed arrow: required operational oversight, not evaluated in this study.</text>
</svg>
