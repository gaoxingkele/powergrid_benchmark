<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Formal test paired-contrast figure placeholder</title>
  <desc id="desc">A deliberately empty scaffold that cannot be mistaken for a result.</desc>
  <defs><style>.h{font:700 30px Arial;fill:#0f172a}.t{font:24px Arial;fill:#b91c1c}.s{font:18px Arial;fill:#334155}.axis{stroke:#334155;stroke-width:2}.box{fill:#fff7ed;stroke:#c2410c;stroke-width:3;stroke-dasharray:12 9;rx:16}</style></defs>
  <rect width="1400" height="760" fill="white"/><text x="700" y="50" text-anchor="middle" class="h">Registered paired ROUGE-L contrasts</text>
  <line x1="260" y1="120" x2="260" y2="610" class="axis"/><line x1="260" y1="610" x2="1260" y2="610" class="axis"/><line x1="760" y1="120" x2="760" y2="610" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 7"/>
  <text x="245" y="155" text-anchor="end" class="s">Full − no-CF, K=5</text><text x="245" y="235" text-anchor="end" class="s">Full − no-CF, K=10</text><text x="245" y="315" text-anchor="end" class="s">Full − Semantic-MMR, K=5</text><text x="245" y="395" text-anchor="end" class="s">Full − Semantic-MMR, K=10</text><text x="245" y="475" text-anchor="end" class="s">Full − TextRank, K=5</text><text x="245" y="555" text-anchor="end" class="s">Full − TextRank, K=10</text>
  <rect x="430" y="240" width="660" height="215" class="box"/><text x="760" y="315" text-anchor="middle" class="t">EVIDENCE_PENDING_TEST</text><text x="760" y="360" text-anchor="middle" class="s">No points, intervals, axis values, or rankings are available.</text><text x="760" y="400" text-anchor="middle" class="s">Populate only from independently audited formal-run artifacts.</text>
  <text x="760" y="650" text-anchor="middle" class="s">Full minus baseline ROUGE-L F1 (scale to be set after audit)</text><text x="700" y="710" text-anchor="middle" class="s">Final figure must show report-level paired values and 95% intervals; it must not display unsupported significance symbols.</text>
</svg>
