<text x="1210.0" y="287.0" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#425b6c">post decision</text>
<text x="48" y="855" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#536978">Solid arrows = execution dependencies; dashed arrows = append-only audit posts.</text>
