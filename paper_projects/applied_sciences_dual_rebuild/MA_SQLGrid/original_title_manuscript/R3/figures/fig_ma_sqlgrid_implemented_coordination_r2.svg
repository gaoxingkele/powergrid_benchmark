<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<title>MA-SQLGrid: R2 fail-closed coordination and executor boundary</title><desc>Five evidence roles, database-enforced read-only execution, complete-state evidence gating, and deterministic adjudication</desc>
<text x="800" y="43" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#153247">MA-SQLGrid: R2 fail-closed coordination and executor boundary</text>
<text x="800" y="75" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#536978">External frozen candidates; bounded read-only SQLite; complete state evidence; gold only after sealing</text>
<g data-box="Question input"><rect x="35" y="120" width="190" height="150" rx="16" fill="#e9f3f8" stroke="#24445c" stroke-width="2" filter="url(#shadow)"/><line x1="35" y1="171" x2="225" y2="171" stroke="#24445c" stroke-width="1" opacity="0.55"/></g>
<text x="130.0" y="154" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153247">Question input</text>
<text x="53" y="198" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#183240">
<tspan x="53" dy="0">question ID</tspan>
<tspan x="53" dy="25">natural-language</tspan>
<tspan x="53" dy="25">question</tspan>
</text>
<g data-box="Database input"><rect x="35" y="310" width="190" height="165" rx="16" fill="#e9f3f8" stroke="#24445c" stroke-width="2" filter="url(#shadow)"/><line x1="35" y1="361" x2="225" y2="361" stroke="#24445c" stroke-width="1" opacity="0.55"/></g>
<text x="130.0" y="344" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153247">Database input</text>
<text x="53" y="388" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#183240">
<tspan x="53" dy="0">schema</tspan>
<tspan x="53" dy="25">foreign keys</tspan>
<tspan x="53" dy="25">authorized schema view</tspan>
</text>
<g data-box="External evidence"><rect x="35" y="520" width="190" height="185" rx="16" fill="#fff4df" stroke="#24445c" stroke-width="2" filter="url(#shadow)"/><line x1="35" y1="571" x2="225" y2="571" stroke="#24445c" stroke-width="1" opacity="0.55"/></g>
<text x="130.0" y="554" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153247">External evidence</text>
<text x="53" y="598" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#183240">
<tspan x="53" dy="0">candidate SQL strings</tspan>
<tspan x="53" dy="25">counterfactual</tspan>
<tspan x="53" dy="25">state results</tspan>
<tspan x="53" dy="25">expected state IDs</tspan>
</text>
<g data-box="1  Query Analyst"><rect x="285" y="100" width="235" height="155" rx="16" fill="#e8f5ef" stroke="#24445c" stroke-width="2" filter="url(#shadow)"/><line x1="285" y1="151" x2="520" y2="151" stroke="#24445c" stroke-width="1" opacity="0.55"/></g>
<text x="402.5" y="134" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153247">1  Query Analyst</text>
<text x="303" y="178" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#183240">
<tspan x="303" dy="0">aggregation cues</tspan>
<tspan x="303" dy="25">ordering + limit</tspan>
<tspan x="303" dy="25">lexical tokens</tspan>
</text>
<g data-box="2  Schema Cartographer"><rect x="285" y="300" width="235" height="180" rx="16" fill="#e8f5ef" stroke="#24445c" stroke-width="2" filter="url(#shadow)"/><line x1="285" y1="351" x2="520" y2="351" stroke="#24445c" stroke-width="1" opacity="0.55"/></g>
<text x="402.5" y="334" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153247">2  Schema Cartographer</text>
<text x="303" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#183240">
<tspan x="303" dy="0">token-overlap tables</tspan>
<tspan x="303" dy="25">matched columns</tspan>
<tspan x="303" dy="25">in-scope join edges</tspan>
<tspan x="303" dy="25">unmatched tokens</tspan>
</text>
<g data-box="3  SQL Synthesizer"><rect x="285" y="540" width="235" height="165" rx="16" fill="#e8f5ef" stroke="#24445c" stroke-width="2" filter="url(#shadow)"/><line x1="285" y1="591" x2="520" y2="591" stroke="#24445c" stroke-width="1" opacity="0.55"/></g>
<text x="402.5" y="574" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153247">3  SQL Synthesizer</text>
<text x="303" y="618" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#183240">
<tspan x="303" dy="0">canonicalize + deduplicate</tspan>
<tspan x="303" dy="25">package external SQL</tspan>
<tspan x="303" dy="25">assign stable IDs</tspan>
</text>
<text x="402.5" y="690" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5d6870">Does not generate SQL or call a model</text>
<g data-box="4  Safety Validator"><rect x="585" y="300" width="245" height="190" rx="16" fill="#f2edfa" stroke="#24445c" stroke-width="2" filter="url(#shadow)"/><line x1="585" y1="351" x2="830" y2="351" stroke="#24445c" stroke-width="1" opacity="0.55"/></g>
<text x="707.5" y="334" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153247">4  DB Safety Validator</text>
<text x="603" y="378" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#183240">
<tspan x="603" dy="0">single statement</tspan>
<tspan x="603" dy="25">mode=ro + query_only</tspan>
<tspan x="603" dy="25">authorizer + extensions off</tspan>
<tspan x="603" dy="25">time/opcode/row limits</tspan>
<tspan x="603" dy="25">retain every failure; no retry</tspan>
</text>
<g data-box="5  Counterfactual Critic"><rect x="585" y="540" width="245" height="175" rx="16" fill="#f2edfa" stroke="#24445c" stroke-width="2" filter="url(#shadow)"/><line x1="585" y1="591" x2="830" y2="591" stroke="#24445c" stroke-width="1" opacity="0.55"/></g>
<text x="707.5" y="574" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153247">5  Counterfactual Critic</text>
<text x="603" y="618" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#183240">
<tspan x="603" dy="0">consume supplied states</tspan>
<tspan x="603" dy="25">execution + equivalence</tspan>
<tspan x="603" dy="25">pass/fail state IDs</tspan>
<tspan x="603" dy="25">coverage completeness</tspan>
</text>
<g data-box="Append-only blackboard"><rect x="885" y="110" width="300" height="395" rx="16" fill="#eef1f3" stroke="#24445c" stroke-width="2" filter="url(#shadow)"/><line x1="885" y1="161" x2="1185" y2="161" stroke="#24445c" stroke-width="1" opacity="0.55"/></g>
<text x="1035.0" y="144" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153247">Append-only blackboard</text>
<text x="903" y="188" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#183240">
<tspan x="903" dy="0">0  query_intent</tspan>
<tspan x="903" dy="25">1  schema_grounding</tspan>
<tspan x="903" dy="25">2  sql_candidates</tspan>
<tspan x="903" dy="25">3+ validation_evidence</tspan>
<tspan x="903" dy="25">…  counterfactual_evidence</tspan>
<tspan x="903" dy="25">last  decision</tspan>
<tspan x="903" dy="25">then seal + SHA-256 audit digest</tspan>
</text>
<text x="1035.0" y="490" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5d6870">Records handoffs; it is not a conversational memory</text>
<g data-box="Deterministic adjudicator"><rect x="1235" y="255" width="320" height="260" rx="16" fill="#eaf1fb" stroke="#24445c" stroke-width="2" filter="url(#shadow)"/><line x1="1235" y1="306" x2="1555" y2="306" stroke="#24445c" stroke-width="1" opacity="0.55"/></g>
<text x="1395.0" y="289" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153247">Deterministic adjudicator</text>
<text x="1253" y="333" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#183240">
<tspan x="1253" dy="0">Eligibility: safe AND executable</tspan>
<tspan x="1253" dy="25">CF: complete coverage</tspan>
<tspan x="1253" dy="25">→ registered pass threshold</tspan>
<tspan x="1253" dy="25">→ validation points</tspan>
<tspan x="1253" dy="25">→ frozen candidate order</tspan>
</text>
<text x="1395.0" y="500" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5d6870">Reference-free; no gold SQL access</text>
<g data-box="Decision"><rect x="1235" y="610" width="320" height="145" rx="16" fill="#e8f5ef" stroke="#24445c" stroke-width="2" filter="url(#shadow)"/><line x1="1235" y1="661" x2="1555" y2="661" stroke="#24445c" stroke-width="1" opacity="0.55"/></g>
<text x="1395.0" y="644" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#153247">Decision</text>
<text x="1253" y="688" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#183240">
<tspan x="1253" dy="0">SELECT candidate + SQL</tspan>
<tspan x="1253" dy="25">or ABSTAIN when no candidate</tspan>
<tspan x="1253" dy="25">passes every required gate</tspan>
</text>
