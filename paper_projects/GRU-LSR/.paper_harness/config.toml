journal = "ieee_access"
manuscript = "manuscript/journal_submission/paper.tex"

[checks]
abstract_word_limit = 250
placeholder_globs = ["manuscript/MANUSCRIPT.md"]
required_tracked_files = [
  "manuscript/MANUSCRIPT.md",
  "../../papers/mintou/mintou_p1_dstar_gru_dispatch/src/configs/real_rts_dispatch_config.json",
  "../../scripts/mintou/build_official_journal_previews.py",
  "../../scripts/mintou/harness_acceptance.py",
  "../../scripts/mintou/harness_scientific_acceptance.py",
  "../../tests/test_mintou_experiments.py",
  "../../src/powergrid_benchmark/mintou_experiments.py",
]
allowed_write_paths = [
  "../../papers/mintou/mintou_p1_dstar_gru_dispatch",
  "../../src/powergrid_benchmark/mintou_real_curtailment.py",
  "../../src/powergrid_benchmark/mintou_real_dispatch.py",
  "../../src/powergrid_benchmark/mintou_p1_nrel_validation.py",
]
read_only_paths = ["../../papers/mintou"]

[transport]
command = "codex exec"
