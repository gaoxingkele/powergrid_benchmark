  "checkpoints/2026-09-03_mdpi_wave0/CLAIM_EVIDENCE_REGISTER.md",
  "../../tests/test_mintou_experiments.py",
  "../../src/powergrid_benchmark/mintou_experiments.py",
]
allowed_write_paths = [
  "../../papers/mintou/mintou_p2_hygraph_load_forecasting",
  "../../src/powergrid_benchmark/mintou_real_load_forecasting.py",
  "../../src/powergrid_benchmark/mintou_neural_forecasting.py",
