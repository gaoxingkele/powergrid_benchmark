tree:
  - id: N01
    type: question
    support_level: explicit
    source_refs: ["Abstract", "§1", "§2 G1"]
    title: "How can short-term non-stationary residential load be forecast more accurately?"
    description: >
      Directly applying prediction models to non-stationary, nonlinear user electricity
      consumption data hinders exploration of deeper temporal features, leaving room to improve
      short-term user load prediction accuracy.
    children:
      - id: N02
        type: decision
        support_level: explicit
        source_refs: ["§2", "§3.3", "Abstract"]
        title: "Decompose the signal before forecasting, rather than model the raw signal"
        description: >
          Adopt a decompose-then-forecast strategy: separate the load into trend, periodic, and
          random components so each sub-sequence is more predictable.
        children:
          - id: N03
            type: decision
            support_level: explicit
            source_refs: ["§3.1", "§3.2", "§3.3"]
            title: "Choose the decomposition method: EMD → EEMD → CEEMDAN"
            description: >
              Survey EMD (adaptive but mode-mixing prone), EEMD (adds noise, costly, residual
              noise), and CEEMDAN (adaptive noise, near-0% reconstruction error, fewer runs).
            children:
              - id: N04
                type: dead_end
                support_level: explicit
                source_refs: ["§2", "§3.2", "[42]"]
                title: "Plain EMD front-end rejected (mode mixing)"
                description: >
                  EMD is prone to mode mixing, coupling content across time scales and producing
                  physically meaningless IMFs; discarded as the front-end. Retained in the
                  prediction comparison as the EMD-LSTM baseline.
              - id: N05
                type: decision
                support_level: explicit
                source_refs: ["§3.3", "§5.1"]
                title: "Adopt CEEMDAN with adaptive noise as the front-end"
                description: >
                  CEEMDAN adds adaptive noise per stage (coefficient epsilon_k), stops when the
                  residual has <3 extreme points, and reconstructs with near-0% error using fewer
                  averaging runs. Noise amplitude 0.1x std, 200 noise sets, 8 IMFs.
                evidence: ["C02", "C05"]
          - id: N06
            type: decision
            support_level: explicit
            source_refs: ["§3.3", "§5.1"]
            title: "Design a large sliding window sized by the decomposition objective"
            description: >
              Size the window to encompass the periodic and trend scales (60 days, step 1), extract
              a fixed-length rear segment, and linearly extend extreme points for endpoint effects,
              rather than sizing the window to the network input length.
            evidence: ["C04"]
            children:
              - id: N07
                type: dead_end
                support_level: explicit
                source_refs: ["§8 (Figure 2 discussion)", "§3.3"]
                title: "Window sized to network input length rejected"
                description: >
                  If the window size is set from the network input-sequence length, trend and
                  periodic components cannot be separated; rejected in favor of a large,
                  decomposition-driven window. Asserted as rationale, not run as an ablation.
      - id: N08
        type: decision
        support_level: explicit
        source_refs: ["§4", "§4.3"]
        title: "Forecast each component with an independent LSTM sub-model, then reconstruct"
        description: >
          Use LSTM (over RNN) to avoid gradient vanishing; the last-time-step output summarizes the
          sequence. One sub-model per IMF/residual component, run in parallel; overlay component
          forecasts into the final prediction.
        children:
          - id: N09
            type: decision
            support_level: explicit
            source_refs: ["§4.1", "§9 (Figure 3)", "[46]", "[47]"]
            title: "Place Batch Normalization after the LSTM layer"
            description: >
              Prior work found horizontal BN in RNNs performs poorly and vertical BN before LSTM did
              not help for small-scale data; therefore BN is placed after the LSTM layer.
          - id: N10
            type: decision
            support_level: explicit
            source_refs: ["§4.2", "§10 (Figure 4)", "[48]"]
            title: "Add Dropout for overfitting mitigation"
            description: >
              Dropout (p=0.5) randomly deactivates neurons to regularize; noted to roughly double
              training time due to stochastic weight updates.
      - id: N11
        type: experiment
        support_level: explicit
        source_refs: ["§5.1", "Figure 6", "Figure 7"]
        title: "Sequence decomposition analysis"
        description: >
          Decompose one user's hourly load with CEEMDAN into 8 IMFs + RES; observe that IMF1-3 are
          stochastic, IMF4-7 periodic, IMF8+RES trend, confirming decomposition captures load
          properties.
        evidence: ["C04", "C05"]
      - id: N12
        type: experiment
        support_level: explicit
        source_refs: ["§5.2", "Table 3", "Figure 9"]
        title: "Hourly load prediction comparison"
        description: >
          Compare CEEMDAN-LSTM vs LSTM, RNN, EMD-LSTM on hourly load over 50 users; RMSE and MAE.
        evidence: ["C01", "C02", "C03"]
      - id: N13
        type: experiment
        support_level: explicit
        source_refs: ["§5.2", "Table 4", "Figure 10"]
        title: "Daily load prediction comparison"
        description: >
          Compare the four models on daily load over 50 users; RMSE and MAE; 500-day training set,
          180-day training window, last 30 days as test set.
        evidence: ["C01", "C02", "C03"]
      - id: N14
        type: decision
        support_level: explicit
        source_refs: ["§6 Conclusions"]
        title: "Future work: inject artificial deceptive behaviors and add variables"
        description: >
          The conclusion states future work will enhance anomaly-detection accuracy by introducing
          artificially generated deceptive behaviors and incorporating other variables to reduce
          experimental errors. A stated forward-looking direction, not an executed step.
