version: 1
paper_id: optimization_principles_applied_in_planning_and_operation_of_active_di
collection: by_journal/Energies
tree:
  - id: N01
    type: question
    support_level: explicit
    source_refs: ["1", "3"]
    title: "What optimization principles are applicable to the planning and operation of active distribution networks?"
    description: "The editorial surveys optimization objectives, methods, and challenges for ADNs, framing a multi-objective landscape across technical, economic, and environmental domains."
    children:
      - id: N02
        type: question
        support_level: explicit
        source_refs: ["2"]
        title: "What are the key optimization objectives for ADN planning and operation?"
        description: "Twelve objectives identified: loss minimization, operational cost, voltage stability, demand-side management, renewable hosting capacity, emission minimization, resilience, power imbalance, reliability, network expansion, EV integration, dual heating-electric planning."
        children:
          - id: N03
            type: decision
            support_level: explicit
            source_refs: ["2"]
            title: "Multi-objective trade-off recognition"
            choice: "Frame optimization as inherently multi-objective, requiring trade-offs between competing criteria"
            alternatives:
              - "Single-objective optimization (e.g., cost-only) -- insufficient because objectives conflict"
            children:
              - id: N04
                type: decision
                support_level: explicit
                source_refs: ["2"]
                title: "Planning-operation integration"
                choice: "Cover both planning-stage and operational-stage optimization, emphasizing their interdependence"
                alternatives:
                  - "Treating planning and operation separately -- creates inefficiencies"
                children:
                  - id: N05
                    type: decision
                    support_level: explicit
                    source_refs: ["2"]
                    title: "DSM-renewable synergy recognition"
                    choice: "Identify demand-side management and renewable integration as mutually reinforcing objectives"
                    alternatives:
                      - "Treating DSM and renewable integration independently"

      - id: N06
        type: question
        support_level: explicit
        source_refs: ["2"]
        title: "What optimization methods are used in ADN contexts?"
        description: "Methods include MILP, genetic algorithms, particle swarm optimization, machine learning, and specialized heuristics (Marine Predator Algorithm, Binary Firefly Algorithm)."
        children:
          - id: N07
            type: decision
            support_level: explicit
            source_refs: ["2"]
            title: "Methodological diversity"
            choice: "Survey diverse methodologies rather than advocating a single approach"
            alternatives:
              - "Focusing on one methodology class exclusively"

      - id: N08
        type: question
        support_level: explicit
        source_refs: ["2"]
        title: "Which contributions does this Special Issue highlight?"
        description: "Five selected papers spanning PV integration, microgrid control, DG allocation, PMU placement, and flexibility management."
        children:
          - id: N09
            type: experiment
            support_level: explicit
            source_refs: ["2"]
            title: "Thematic survey of optimization objectives (E01)"
            result: "A structured taxonomy of twelve ADN optimization objectives across technical, economic, environmental, and integrated domains"
            evidence: [C01, C02, C03, C04]
          - id: N10
            type: experiment
            support_level: explicit
            source_refs: ["2"]
            title: "Methodology classification (E02)"
            result: "Mapping of methodology classes (MILP, GA, PSO, ML, heuristics) to applicable ADN optimization problems"
            evidence: [C01, C02]
          - id: N11
            type: experiment
            support_level: explicit
            source_refs: ["2"]
            title: "Special Issue contribution mapping (E03)"
            result: "Five contributions collectively span different objectives (renewable hosting, voltage regulation, observability, flexibility) and methods (DOE, metaheuristics, graph theory)"
            evidence: [C02, C04]
