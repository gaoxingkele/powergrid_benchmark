# Exploration Tree for: Multi-Timescale Coordinated Planning of Wind, Solar, and Energy Storage Considering Generalized Adequacy
# Source: Yin et al., Energies 2025, 18, 5024
# support_level: explicit (all nodes are explicitly documented in the paper)

nodes:
  - id: Q01
    type: question
    description: "How can traditional adequacy be extended to account for flexibility and inertia needs in high-renewable power systems?"
    support_level: explicit
    source_ref: "SS2.1, pp.3-4: 'The traditional adequacy concept is extended, and a generalized adequacy framework is proposed'"
    children:
      - id: Q01a
        type: question
        description: "What metrics should capture power/energy, flexibility, and inertia adequacy?"
        support_level: explicit
        source_ref: "SS2.2, pp.4-9: 'seven evaluation metrics are proposed along with their corresponding assessment methodologies'"
        children:
          - id: D01
            type: decision
            description: "Select LOLH, EENS, EENS_CVaR for power/energy adequacy; flexible ramp capacity margin and ramp rate margin for flexibility; minimum inertia and inertia margin for inertia adequacy"
            support_level: explicit
            source_ref: "SS2.2.1-2.2.3"
            children:
              - id: DE01
                type: dead_end
                description: "Alternative: single-metric LOLE with 0.1 d/a threshold [7] is deemed insufficient; paper explicitly rejects this approach"
                support_level: explicit
                source_ref: "SS2.2.1: 'expanding from single-metric evaluation to a multi-metric framework'"
              - id: DE02
                type: dead_end
                description: "Alternative: pure operational inertia metrics (e.g., from [12][13]) are rejected for planning because they assess from an operational perspective, not a planning perspective"
                support_level: explicit
                source_ref: "SS2.2.3: 'Existing inertia indices in academic research primarily assess frequency security from an operational perspective; to support planning, it is essential to develop an inertia adequacy index from a planning perspective'"

  - id: Q02
    type: question
    description: "How should the planning model coordinate wind, solar, multi-timescale storage, and transmission to enhance generalized adequacy?"
    support_level: explicit
    source_ref: "SS3.1-3.2, pp.9-13"
    children:
      - id: D02
        type: decision
        description: "Adopt iterative feedback framework (Figure 1): plan -> evaluate adequacy -> incorporate extreme scenarios -> re-plan, rather than single-pass optimization"
        support_level: explicit
        source_ref: "SS3.1: 'The integrated power grid planning process is iteratively executed until a planning scheme that satisfies generalized adequacy requirements is obtained'"
        children:
          - id: D02a
            type: decision
            description: "Decompose annual 8760 h into intra-day and inter-day timescales using method from [29] to model storage energy transfer"
            support_level: explicit
            source_ref: "SS3.2.1: 'employs the temporal decomposition method proposed in [29]'"
          - id: D02b
            type: decision
            description: "Model short-term operation constraints including DC power flow, PFR capacity limits, RoCoF constraint, and frequency nadir constraint"
            support_level: explicit
            source_ref: "SS3.2.2, Eqs. 25-36"
          - id: DE03
            type: dead_end
            description: "Alternative: traditional single-optimization approach is rejected because generalized adequacy indices 'primarily serve as post-assessment tools... making it challenging to identify directions for further optimizing resource allocation'"
            support_level: explicit
            source_ref: "SS3.1, p.9"

  - id: Q03
    type: question
    description: "How should extreme meteorological events be incorporated into the planning framework?"
    support_level: explicit
    source_ref: "SS2.2.1, Table 1, SS4.1"
    children:
      - id: D03
        type: decision
        description: "Embed extreme scenarios (extreme heat/low wind, extreme cold/low solar, severe drought) into sequential Monte Carlo sampling with ~0.01 probability each, rather than treating them as separate stress tests"
        support_level: explicit
        source_ref: "SS2.2.1: 'These scenarios are randomly embedded in the Monte Carlo sampling to reflect the impact of extreme events on system adequacy'"
        children:
          - id: DE04
            type: dead_end
            description: "Alternative: excluding extreme events entirely (status quo in conventional planning) is rejected because low-probability high-impact events can cause 6x EENS shortages"
            support_level: explicit
            source_ref: "SS4.3: 'the worst-case energy shortage reaches up to six times the EENS value'"

  - id: Q04
    type: question
    description: "How should planning schemes be compared to select the best one given multiple adequacy dimensions?"
    support_level: explicit
    source_ref: "SS3.3, pp.13-16"
    children:
      - id: D04
        type: decision
        description: "Adopt 10-indicator evaluation system (7 adequacy + LCOE + renewable utilization + carbon intensity) with combined AHP-entropy weights and PROMETHEE-II ranking"
        support_level: explicit
        source_ref: "SS3.3.1-3.3.2"
        children:
          - id: D04a
            type: decision
            description: "Use stepwise 0/1 preference function for PROMETHEE-II for simplicity and alignment with threshold-based adequacy assessment"
            support_level: explicit
            source_ref: "SS3.3.2: 'a stepwise 0/1 rule is adopted... due to its high consistency with the threshold-based logic used in adequacy indicator assessment'"
          - id: DE05
            type: dead_end
            description: "Pure weight approaches (AHP alone, entropy alone) are rejected in favor of game-theoretic combined weighting"
            support_level: explicit
            source_ref: "SS3.3.2: 'a game theory-based combined weighting approach is utilized to obtain the final comprehensive weights'"

  - id: Q05
    type: question
    description: "Does the generalized adequacy framework produce measurably better planning outcomes than conventional approaches?"
    support_level: explicit
    source_ref: "SS4, pp.16-25"
    children:
      - id: E01
        type: experiment
        description: "Scenario M1 (traditional baseline): renewables + short-term storage + transmission only"
        support_level: explicit
        source_ref: "Table 3, Table 4, Table 5"
        evidence: "C02, C05"
      - id: E02
        type: experiment
        description: "Scenario M2 (add long-term storage): tests cross-day energy shifting benefit"
        support_level: explicit
        source_ref: "Table 3, Table 4, Table 5"
        evidence: "C02, C03, C05"
      - id: E03
        type: experiment
        description: "Scenario M3 (add frequency constraints): tests inertia adequacy enforcement"
        support_level: explicit
        source_ref: "Table 3, Table 4, Table 5, Figure 8"
        evidence: "C03, C04, C05"
      - id: E04
        type: experiment
        description: "Scenario M4 (full generalized adequacy): adds extreme scenario iteration"
        support_level: explicit
        source_ref: "Table 3, Table 4, Table 5, Figure 5"
        evidence: "C01, C02, C04, C05"
      - id: E05
        type: experiment
        description: "Robustness check: 95% demand percentile vs. max demand"
        support_level: explicit
        source_ref: "Table 6, SS4.3: 'the ranking of the different schemes remains consistent'"
        evidence: "C05"
      - id: E06
        type: experiment
        description: "Inertia adequacy verification: M2 vs M3 operating inertia comparison"
        support_level: explicit
        source_ref: "Figure 8, SS4.2"
        evidence: "C03"
      - id: P01
        type: pivot
        description: "From evaluation to scheme comparison: after all four scenarios quantified, apply PROMETHEE-II to determine the optimal scheme"
        support_level: explicit
        source_ref: "SS4.4, Tables 7-8"
